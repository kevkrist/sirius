sirius:
  topology:
    num_gpus: 1
  memory:
    gpu:
      usage_limit_fraction: 0.95
      reservation_limit_fraction: 1.0
      downgrade_trigger_fraction: 0.9
      downgrade_stop_fraction: 0.85
    host:
      capacity_bytes: 64Gi
      initial_number_pools: 8
      pool_size: 128
      block_size: 1Mi
    disk:
      disk_id: 0
      capacity_bytes: 64Gi
      downgrade_root_dirs: /tmp/tpch-deferred-order-sf100-20261015/spill
  compression:
    enable_pin_table_compression: false
  executor:
    scan_manager:
      backend: sirius
      cache:
        mode: sirius
        eviction: lru
        deferred_device_reads: true
      memory_prefetcher:
        enable: true
        num_threads: 3
      num_threads: 18
      uring_n_reactors: 4
      max_readahead_scans: 8
      readahead_strategy: opportunistic
    pipeline:
      num_threads: 8
    downgrade:
      num_threads: 1
    task_creator:
      num_threads: 4
  operator_params:
    scan_task_batch_size: 1536Mi
    max_sort_partition_bytes: 0
    hash_partition_bytes: 4Gi
    concat_batch_bytes: 1Gi
    max_build_hash_table_bytes: 4Gi
  telemetry:
    enable_quent: true
    exporter: ndjson
    output_directory: /tmp/tpch-deferred-order-sf100-20261015/quent/prefetch8-siblings_first-q1-events
    engine_name: prefetch8-siblings_first-q1
    enable_nvtx: false
